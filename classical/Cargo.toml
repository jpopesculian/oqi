[package]
name = "oqi-classical"
description = "OpenQASM 3 classical values, types and operators, a building block of the oqi toolchain"
keywords = ["openqasm", "qasm", "quantum", "classical"]
categories = ["science", "mathematics"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
num-complex.workspace = true
serde = { workspace = true, optional = true }
turns = "0.1.2"

[features]
# Serialize and deserialize values and types (used by the bytecode format in
# `oqi-compile`).
serde = ["dep:serde", "num-complex/serde", "turns/serde"]

[dev-dependencies]
postcard.workspace = true
