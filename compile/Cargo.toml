[package]
name = "oqi-compile"
version = "0.1.0"
edition = "2024"

[dependencies]
oqi-lex = { path = "../lex" }
oqi-parse = { path = "../parse" }
oqi-diagnostics = { path = "../diagnostics" }
oqi-classical = { path = "../classical" }
oqi-quantum = { path = "../quantum", default-features = false }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
