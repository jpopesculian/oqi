[package]
name = "oqi-compile"
description = "OpenQASM 3 compiler: parses, type-checks and lowers OpenQASM 3 programs to oqi bytecode"
keywords = ["openqasm", "qasm", "quantum", "compiler", "bytecode"]
categories = ["compilers", "science"]
readme = "README.md"
exclude = ["tests/fixtures.rs"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
oqi-lex = { workspace = true, features = ["serde"] }
oqi-parse.workspace = true
oqi-diagnostics.workspace = true
oqi-classical = { workspace = true, features = ["serde"] }
postcard.workspace = true
serde.workspace = true
