[package]
name = "oqi-js"
description = "Compile, run and sample OpenQASM 3 programs in JavaScript (WebAssembly)"
keywords = ["openqasm", "quantum", "simulator", "wasm"]
readme = "README.md"
# Published to npm with wasm-pack, not to crates.io.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Compile the wgpu/WebGPU backend into the wasm module. Off by default so
# native workspace builds and `wasm-pack test` stay wgpu-free; the Pages build
# opts in with `wasm-pack build js --target web --features gpu`.
gpu = ["oqi-vm/gpu"]

[dependencies]
js-sys = "0.3"
oqi-compile.workspace = true
oqi-diagnostics.workspace = true
oqi-vm = { workspace = true, features = ["mps"] }
serde.workspace = true
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
serde_json.workspace = true
wasm-bindgen-test = "0.3"
