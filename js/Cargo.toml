[package]
name = "oqi-js"
version = "0.1.0"
edition = "2024"
description = "Compile, run and sample OpenQASM 3 programs in JavaScript (WebAssembly)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jpopesculian/oqi"
homepage = "https://jpopesculian.github.io/oqi/"
readme = "README.md"
keywords = ["openqasm", "quantum", "simulator", "wasm"]
# Published to npm with wasm-pack, not to crates.io.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Compile the wgpu/WebGPU backend into the wasm module. Off by default so
# native workspace builds and `wasm-pack test` stay wgpu-free; the Pages build
# opts in with `wasm-pack build js --target web --features gpu`.
gpu = ["oqi-vm/gpu"]

[dependencies]
js-sys = "0.3"
oqi-compile = { path = "../compile" }
oqi-diagnostics = { path = "../diagnostics" }
oqi-vm = { path = "../vm", default-features = false, features = ["mps"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
serde_json = "1"
wasm-bindgen-test = "0.3"
