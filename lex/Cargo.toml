[package]
name = "oqi-lex"
version = "0.1.0"
edition = "2024"

[dependencies]
logos = "0.16.1"
serde = { version = "1", features = ["derive"], optional = true }

[features]
# Serialize and deserialize `Span` (used by the bytecode format in `oqi-compile`).
serde = ["dep:serde"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
