[package]
name = "oqi-lex"
description = "Lexer for OpenQASM 3 (including OpenPulse), a building block of the oqi toolchain"
keywords = ["openqasm", "qasm", "quantum", "lexer"]
categories = ["parser-implementations", "science"]
readme = "README.md"
exclude = ["tests/fixtures.rs"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
logos = "0.16.1"
serde = { workspace = true, optional = true }

[features]
# Serialize and deserialize `Span` (used by the bytecode format in `oqi-compile`).
serde = ["dep:serde"]

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
