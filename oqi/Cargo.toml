[package]
name = "oqi"
description = "OpenQASM 3 compiler and quantum simulator: compile, run, sample and format OpenQASM 3 programs"
keywords = ["openqasm", "qasm", "quantum", "simulator", "compiler"]
categories = ["compilers", "simulation", "science"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
oqi-compile.workspace = true
oqi-diagnostics.workspace = true
oqi-format.workspace = true
oqi-parse.workspace = true
oqi-vm.workspace = true
pollster = { workspace = true, optional = true }

[features]
default = ["blocking", "parallel", "mps"]
# `Runner::run_blocking` / `Runner::sample_blocking` and `oqi::block_on`, for
# native callers that don't use an async runtime.
blocking = ["oqi-vm/blocking", "dep:pollster"]
# Multi-threaded state-vector kernels (the `rayon` and `rayon-simd` backends).
parallel = ["oqi-vm/parallel"]
# The matrix-product-state simulator (`MpsSim`, backend name `mps`).
mps = ["oqi-vm/mps"]
# The WebGPU simulator (`GpuSim`, backend names `gpu` and `prefer-gpu`).
gpu = ["oqi-vm/gpu"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }
