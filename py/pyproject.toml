[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "oqi-py"
description = "Compile, run and sample OpenQASM 3 programs on state-vector, stabilizer and matrix-product-state simulators"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.10"
keywords = ["openqasm", "quantum", "simulator", "compiler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
# The version comes from Cargo.toml.
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/jpopesculian/oqi"
Playground = "https://jpopesculian.github.io/oqi/"

[tool.maturin]
module-name = "oqi"
features = ["extension-module"]
